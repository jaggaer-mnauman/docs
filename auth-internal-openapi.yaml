openapi: 3.1.0
info:
  title: Authorization Service (Auth)
  description: ASO OAuth 2.0 authorization service. The client credentials grant allows
    a trusted server-side software component to obtain a long-term system-to-system
    bearer access token. This token allows a client back-end system to make requests
    to system (non-user) end-points on a resource server.
  contact:
    email: bmcmahon@jaggaer.com
  license:
    name: (c) Jaggaer 2026
  version: 26.3.0.0
tags:
- name: JWT Authentication
  description: "JWT token generation, validation, and refresh endpoints"
- name: OAuth 2.0 Authentication
  description: Token acquisition endpoint
paths:
  /jwt/generate:
    post:
      tags:
      - JWT Authentication
      summary: Generate JWT tokens
      description: Generates a new access token and refresh token for a user with
        optional custom claims. A valid ASO TGT is required and can be sent in a Cookie
        header or included in the request body.
      operationId: generateTokens
      parameters:
      - name: Accept
        in: header
        description: Accept
        schema:
          type: string
        example: application/json
      - name: Content-Type
        in: header
        description: Content-Type
        required: true
        schema:
          type: string
        example: application/json
      - name: TGT Cookie
        in: cookie
        description: ASO ticket granting ticket cookie
        schema:
          type: string
        example: CS_TICKET_GRANTING_TICKET_74254726=2bXgOXRE1i4vZX8XFDf0xJx6cnsKlehpKQW5BxMfpT...
      requestBody:
        description: ASO ticket granting ticket
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateTokenRequest'
            examples:
              Request Body:
                description: ASO ticket granting ticket value
                value:
                  tgt: 2bXgOXRE1i4vZX8XFDf0xJx6cnsKlehpKQW5BxMfpT...
      responses:
        "200":
          description: Tokens generated successfully
          headers:
            Set-Cookie:
              description: JWT refresh token
              style: simple
              schema:
                type: string
                format: cookie
              example: ASO_JWT_REFRESH_TOKEN_74254726=2dd4e1bc-83ff-4af1-8d49-fce1a5a3e927;Version=1;Comment=ASO-TGT;Domain=.jaggaer.com;Path=/;Max-Age=604800;Secure;HttpOnly;SameSite=none;Expires=Tue
                Dec 02 17:01:13 EST 2025
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                Success:
                  description: Success response
                  value:
                    accessToken: eyJ0eXAiOiJKV1QiLCJraWQiOiI0N2IxNzg1My1jMDExLTExZj...
                    accessExpiresIn: 600
                    refreshToken: 6730or 1158-40bc-475f-8371-194df5176a4f
                    refreshExpiresIn: 604800
        "400":
          description: Invalid request (missing TGT cookie or value)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Invalid Request:
                  description: TGT cookie or value is required
                  value:
                    error: TGT cookie or value is required
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Not Found:
                  description: TGT not found
                  value:
                    error: TGT Not Found
                Expired:
                  description: TGT is expired
                  value:
                    error: Expired TGT
                Locked:
                  description: Associated user is locked
                  value:
                    error: Locked User
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Unexpected Error:
                  description: Unexpected error
                  value:
                    error: Failed to generate tokens
  /jwt/public-key:
    get:
      tags:
      - JWT Authentication
      summary: Get public key
      description: Returns the RSA public key used for JWT token verification (Base64
        encoded X.509 format)
      operationId: getPublicKey
      parameters:
      - name: Accept
        in: header
        description: Accept
        schema:
          type: string
        example: application/json
      responses:
        "200":
          description: Public key retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicKeyResponse'
              examples:
                Success:
                  description: Success response
                  value:
                    keyId: 47b17853-c011-11f0-bffa-0affeec4ca27
                    issuer: ASO-qacurr
                    keyType: RSA
                    algorithm: RS256
                    keySize: 2048
                    format: X.509
                    publicKey: MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQ...
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Unexpected Error:
                  description: Unexpected error
                  value:
                    error: Failed to retrieve public key
  /jwt/refresh:
    post:
      tags:
      - JWT Authentication
      summary: Refresh JWT tokens
      description: Generates a new access token and refresh token using a valid refresh
        token. The ASO JWT refresh token can be sent in a Cookie header or included
        in the request body.
      operationId: refreshToken
      parameters:
      - name: Accept
        in: header
        description: Accept
        schema:
          type: string
        example: application/json
      - name: Content-Type
        in: header
        description: Content-Type
        required: true
        schema:
          type: string
        example: application/json
      - name: Refresh Token
        in: cookie
        description: ASO JWT refresh token
        schema:
          type: string
        example: ASO_JWT_REFRESH_TOKEN_74254726=ad933685-b1df-48ce-98cb-60e6de6c18ed
      requestBody:
        description: ASO JWT refresh token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
            examples:
              Request Body:
                description: ASO JWT refresh token
                value:
                  refreshToken: e81af5a4-e204-4ee0-ba7e-26f5692d2245
      responses:
        "200":
          description: Tokens refreshed successfully
          headers:
            Set-Cookie:
              description: JWT refresh token
              style: simple
              schema:
                type: string
                format: cookie
              example: ASO_JWT_REFRESH_TOKEN_74254726=2dd4e1bc-83ff-4af1-8d49-fce1a5a3e927;Version=1;Comment=ASO-TGT;Domain=.jaggaer.com;Path=/;Max-Age=604800;Secure;HttpOnly;SameSite=none;Expires=Tue
                Dec 02 17:01:13 EST 2025
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                Success:
                  description: Success response
                  value:
                    accessToken: eyJ0eXAiOiJKV1QiLCJraWQiOiI0N2IxNzg1My1jMDExLTExZj...
                    accessExpiresIn: 600
                    refreshToken: 6730or 1158-40bc-475f-8371-194df5176a4f
                    refreshExpiresIn: 604800
        "400":
          description: Invalid request (missing refresh cookie cookie or value)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Invalid Request:
                  description: Refresh token cookie or value is required
                  value:
                    error: Refresh token cookie or value is required
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Not Found:
                  description: Refresh token not found
                  value:
                    error: Refresh token not found
                Revoked:
                  description: Refresh token revoked
                  value:
                    error: Refresh token revoked
                Expired:
                  description: Refresh token expired
                  value:
                    error: Refresh token expired
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Unexpected Error:
                  description: Unexpected error
                  value:
                    error: Failed to refresh token
  /jwt/validate:
    post:
      tags:
      - JWT Authentication
      summary: Validate JWT token
      description: Validates a JWT access token and returns the user information and
        claims if valid
      operationId: validateAccessToken
      parameters:
      - name: Accept
        in: header
        description: Accept
        schema:
          type: string
        example: application/json
      - name: Content-Type
        in: header
        description: Content-Type
        required: true
        schema:
          type: string
        example: application/json
      requestBody:
        description: ASO JWT access token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateTokenRequest'
            examples:
              Request Body:
                description: ASO JWT access token
                value:
                  token: eyJ0eXAiOiJKV1QiLCJraWQiOiI0N2IxNzg1My1jMDExLTExZj...
      responses:
        "200":
          description: Token validated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateTokenResponse'
              examples:
                Success:
                  description: Success response
                  value:
                    valid: true
                    userId: 155375
                    claims:
                      sub: "155375"
                      iss: ASO-devcurr
                      iat: 1780591093
                      exp: 1780591693
                      userId: 155375
                      j1_user_id: j1-0001
                      username: aseeke+qa_admin@sciquest.com
                      tenant_id: "42010001007"
                      customer_host_id: 259
                      email: aseeke+qa_admin@sciquest.com
                      firstName: Albert
                      lastName: Seeke
                      user_type: admin
                      user_language: en_US
                      issuing_application: ASO
        "400":
          description: Invalid request (missing access token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Invalid Request:
                  description: Access token is required
                  value:
                    error: Access token is required
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateTokenResponse'
              examples:
                Expired:
                  description: Access token expired
                  value:
                    valid: false
                    error: Token has expired
                Invalid Signature:
                  description: Invalid access token signature
                  value:
                    valid: false
                    error: Invalid token signature
                Invalid Token:
                  description: Invalid access token
                  value:
                    valid: false
                    error: Invalid token
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Unexpected Error:
                  description: Unexpected error
                  value:
                    error: Failed to validate token
  /oauth2/token:
    post:
      tags:
      - OAuth 2.0 Authentication
      summary: Bearer Token Issuance
      description: Obtain a system-to-system bearer access token.
      operationId: token
      parameters:
      - name: Accept
        in: header
        description: Accept
        required: true
        schema:
          type: string
        example: application/json
      - name: Content-Type
        in: header
        description: Content-Type
        required: true
        schema:
          type: string
        example: application/x-www-form-urlencoded
      - name: X-API-KEY
        in: header
        description: Api key
        required: true
        schema:
          type: string
        example: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
      - name: grant_type
        in: query
        description: OAuth grant_type; Will always be 'grant_type=client_credentials'
        required: true
        schema:
          type: string
        example: grant_type=client_credentials
      - name: scope
        in: query
        description: "Token scope; Will be 'tenant-aso {customer-host-id}' or 'tenant-j1\
          \ {tenant-id}'"
        required: true
        schema:
          type: string
        examples:
          tenant-aso:
            description: Scope the token using customer host ID
            value: scope=tenant-aso 275
          tenant-j1:
            description: Scope the token using tenant ID
            value: scope=tenant-j1 99999999009
      - name: Authorization
        in: header
        description: Uses 'Basic' auth and takes the value of Base64ed 'client-id:client-secret'
        required: true
        schema:
          type: string
        example: Basic cWFfYWRtaW5fYXBpOjM3ODQzlMpOlillMDktMTFlYi1hMGJhLTAwNTA1NjgwZmVlYQ==
      responses:
        "200":
          description: System-to-system bearer access token successfully returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
              examples:
                SUCCESS:
                  description: Success response
                  value:
                    scope: "2"
                    access_token: 3ea64352-8a05-4bb1-a2ac-d4e40e5a0837
                    token_type: bearer
                    expires_in: 86400
        "400":
          description: Invalid request
        "401":
          description: Authorization or authentication issue
        "403":
          description: Authorization or authentication issue
components:
  schemas:
    TokenResponse:
      required:
      - accessExpiresIn
      - accessToken
      - refreshExpiresIn
      - refreshToken
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token
          readOnly: true
          example: eyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiIxMjM0NTY3ODkwIn0.abc123...
        accessExpiresIn:
          type: integer
          description: Access token expiration time in seconds
          format: int32
          readOnly: true
          example: 900
        refreshToken:
          maxLength: 255
          type: string
          description: JWT refresh token
          readOnly: true
          example: 2dd4e1bc-83ff-4af1-8d49-fce1a5a3e927
        refreshExpiresIn:
          type: integer
          description: Refresh token expiration time in seconds
          format: int32
          readOnly: true
          example: 604800
      description: Response object containing generated JWT tokens
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
    GenerateTokenRequest:
      required:
      - tgt
      type: object
      properties:
        tgt:
          maxLength: 255
          type: string
          description: ASO ticket granting ticket
          example: 2bXgOXRE1i4vZX8XFDf0xJx6cnsKlehpKQW5BxMfpT
      description: Request object for generating JWT tokens
    PublicKeyResponse:
      required:
      - algorithm
      - format
      - issuer
      - keyId
      - keySize
      - keyType
      - publicKey
      type: object
      properties:
        keyId:
          maxLength: 255
          type: string
          description: Unique key pair identifier
          readOnly: true
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        issuer:
          maxLength: 255
          type: string
          description: Token issuer identifier
          readOnly: true
          example: ASO-prod
        keyType:
          maxLength: 10
          type: string
          description: Cryptographic key type
          readOnly: true
          example: RSA
          enum:
          - RSA
        algorithm:
          maxLength: 10
          type: string
          description: Signing algorithm
          readOnly: true
          example: RS256
          enum:
          - RS256
          - RS512
        keySize:
          type: integer
          description: Key size in bits
          format: int32
          readOnly: true
          example: 2048
        format:
          maxLength: 20
          type: string
          description: Public key encoding format
          readOnly: true
          example: X.509
        publicKey:
          type: string
          description: Base64-encoded public key
          readOnly: true
          example: MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8A...
      description: Response object containing the public key for JWT verification
    RefreshTokenRequest:
      required:
      - refreshToken
      type: object
      properties:
        refreshToken:
          maxLength: 255
          type: string
          description: JWT refresh token
          example: 2dd4e1bc-83ff-4af1-8d49-fce1a5a3e927
      description: Request object for refreshing JWT tokens
    ValidateTokenResponse:
      required:
      - valid
      type: object
      properties:
        valid:
          type: boolean
          description: Whether the token is valid
          readOnly: true
          example: true
        userId:
          type: integer
          description: User ID from the token claims
          format: int32
          readOnly: true
          example: 12345
        claims:
          type: object
          additionalProperties:
            type: object
            description: Token claims map
            readOnly: true
          description: Token claims map
          readOnly: true
        error:
          maxLength: 500
          type: string
          description: Error message if token is invalid
          readOnly: true
          example: Token has expired
      description: Response object for token validation
    ValidateTokenRequest:
      required:
      - token
      type: object
      properties:
        token:
          type: string
          description: JWT token to validate
          example: eyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiIxMjM0NTY3ODkwIn0.abc123...
      description: Request object for validating JWT tokens
    AccessTokenResponse:
      required:
      - access_token
      - expires_in
      - token_type
      type: object
      properties:
        scope:
          maxLength: 255
          type: string
          description: Token scope
          readOnly: true
          example: "102"
        access_token:
          type: string
          description: OAuth 2.0 access token
          readOnly: true
          example: eyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiIxMjM0NTY3ODkwIn0.abc123...
        token_type:
          maxLength: 20
          type: string
          description: Token type
          readOnly: true
          example: Bearer
          enum:
          - Bearer
        expires_in:
          type: integer
          description: Token expiration time in seconds
          format: int32
          readOnly: true
          example: 3600
        refresh_token:
          maxLength: 255
          type: string
          description: OAuth 2.0 refresh token
          readOnly: true
          example: 2dd4e1bc-83ff-4af1-8d49-fce1a5a3e927
      description: OAuth 2.0 access token response
