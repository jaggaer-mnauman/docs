openapi: 3.0.1
info:
  title: Authorization Service (Auth)
  description: ASO OAuth 2.0 authorization service. The client credentials grant allows
    a trusted server-side software component to obtain a long-term system-to-system
    bearer access token. This token allows a client back-end system to make requests
    to system (non-user) end-points on a resource server.
  contact:
    email: bmcmahon@jaggaer.com
  license:
    name: (c) Jaggaer 2024
  version: 25.1.0.0
tags:
- name: JWT Authentication
  description: "JWT token generation, validation, and refresh endpoints"
- name: OAuth 2.0 Authentication
  description: Token acquisition endpoint
paths:
  /jwt/generate:
    post:
      tags:
      - JWT Authentication
      summary: Generate JWT tokens
      description: Generates a new access token and refresh token for a user with
        optional custom claims. A valid ASO TGT is required and can be sent in a Cookie
        header or included in the request body.
      operationId: generateTokens
      parameters:
      - name: Accept
        in: header
        description: Accept
        schema:
          type: string
        example: application/json
      - name: Content-Type
        in: header
        description: Content-Type
        required: true
        schema:
          type: string
        example: application/json
      - name: TGT Cookie
        in: cookie
        description: ASO ticket granting ticket cookie
        schema:
          type: string
        example: CS_TICKET_GRANTING_TICKET_74254726=2bXgOXRE1i4vZX8XFDf0xJx6cnsKlehpKQW5BxMfpT...
      requestBody:
        description: ASO ticket granting ticket
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateTokenRequest'
            examples:
              Request Body:
                description: ASO ticket granting ticket value
                value:
                  tgt: 2bXgOXRE1i4vZX8XFDf0xJx6cnsKlehpKQW5BxMfpT...
      responses:
        "200":
          description: Tokens generated successfully
          headers:
            Set-Cookie:
              description: JWT refresh token
              style: simple
              schema:
                type: string
                format: cookie
              example: ASO_JWT_REFRESH_TOKEN_74254726=2dd4e1bc-83ff-4af1-8d49-fce1a5a3e927;Version=1;Comment=ASO-TGT;Domain=.jaggaer.com;Path=/;Max-Age=604800;Secure;HttpOnly;SameSite=none;Expires=Tue
                Dec 02 17:01:13 EST 2025
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                Success:
                  description: Success response
                  value:
                    accessToken: eyJ0eXAiOiJKV1QiLCJraWQiOiI0N2IxNzg1My1jMDExLTExZj...
                    accessExpiresIn: 600
                    refreshToken: 6730or 1158-40bc-475f-8371-194df5176a4f
                    refreshExpiresIn: 604800
        "400":
          description: Invalid request (missing TGT cookie or value)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Invalid Request:
                  description: TGT cookie or value is required
                  value:
                    error: TGT cookie or value is required
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Not Found:
                  description: TGT not found
                  value:
                    error: TGT Not Found
                Expired:
                  description: TGT is expired
                  value:
                    error: Expired TGT
                Locked:
                  description: Associated user is locked
                  value:
                    error: Locked User
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Unexpected Error:
                  description: Unexpected error
                  value:
                    error: Failed to generate tokens
  /jwt/public-key:
    get:
      tags:
      - JWT Authentication
      summary: Get public key
      description: Returns the RSA public key used for JWT token verification (Base64
        encoded X.509 format)
      operationId: getPublicKey
      parameters:
      - name: Accept
        in: header
        description: Accept
        schema:
          type: string
        example: application/json
      responses:
        "200":
          description: Public key retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicKeyResponse'
              examples:
                Success:
                  description: Success response
                  value:
                    keyId: 47b17853-c011-11f0-bffa-0affeec4ca27
                    issuer: ASO-qacurr
                    keyType: RSA
                    algorithm: RS256
                    keySize: 2048
                    format: X.509
                    publicKey: MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQ...
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Unexpected Error:
                  description: Unexpected error
                  value:
                    error: Failed to retrieve public key
  /jwt/refresh:
    post:
      tags:
      - JWT Authentication
      summary: Refresh JWT tokens
      description: Generates a new access token and refresh token using a valid refresh
        token. The ASO JWT refresh token can be sent in a Cookie header or included
        in the request body.
      operationId: refreshToken
      parameters:
      - name: Accept
        in: header
        description: Accept
        schema:
          type: string
        example: application/json
      - name: Content-Type
        in: header
        description: Content-Type
        required: true
        schema:
          type: string
        example: application/json
      - name: Refresh Token
        in: cookie
        description: ASO JWT refresh token
        schema:
          type: string
        example: ASO_JWT_REFRESH_TOKEN_74254726=ad933685-b1df-48ce-98cb-60e6de6c18ed
      requestBody:
        description: ASO JWT refresh token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
            examples:
              Request Body:
                description: ASO JWT refresh token
                value:
                  refreshToken: e81af5a4-e204-4ee0-ba7e-26f5692d2245
      responses:
        "200":
          description: Tokens refreshed successfully
          headers:
            Set-Cookie:
              description: JWT refresh token
              style: simple
              schema:
                type: string
                format: cookie
              example: ASO_JWT_REFRESH_TOKEN_74254726=2dd4e1bc-83ff-4af1-8d49-fce1a5a3e927;Version=1;Comment=ASO-TGT;Domain=.jaggaer.com;Path=/;Max-Age=604800;Secure;HttpOnly;SameSite=none;Expires=Tue
                Dec 02 17:01:13 EST 2025
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                Success:
                  description: Success response
                  value:
                    accessToken: eyJ0eXAiOiJKV1QiLCJraWQiOiI0N2IxNzg1My1jMDExLTExZj...
                    accessExpiresIn: 600
                    refreshToken: 6730or 1158-40bc-475f-8371-194df5176a4f
                    refreshExpiresIn: 604800
        "400":
          description: Invalid request (missing refresh cookie cookie or value)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Invalid Request:
                  description: Refresh token cookie or value is required
                  value:
                    error: Refresh token cookie or value is required
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Not Found:
                  description: Refresh token not found
                  value:
                    error: Refresh token not found
                Revoked:
                  description: Refresh token revoked
                  value:
                    error: Refresh token revoked
                Expired:
                  description: Refresh token expired
                  value:
                    error: Refresh token expired
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Unexpected Error:
                  description: Unexpected error
                  value:
                    error: Failed to refresh token
  /jwt/validate:
    post:
      tags:
      - JWT Authentication
      summary: Validate JWT token
      description: Validates a JWT access token and returns the user information and
        claims if valid
      operationId: validateAccessToken
      parameters:
      - name: Accept
        in: header
        description: Accept
        schema:
          type: string
        example: application/json
      - name: Content-Type
        in: header
        description: Content-Type
        required: true
        schema:
          type: string
        example: application/json
      requestBody:
        description: ASO JWT access token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateTokenRequest'
            examples:
              Request Body:
                description: ASO JWT access token
                value:
                  token: eyJ0eXAiOiJKV1QiLCJraWQiOiI0N2IxNzg1My1jMDExLTExZj...
      responses:
        "200":
          description: Token validated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateTokenResponse'
              examples:
                Success:
                  description: Success response
                  value:
                    valid: true
                    userId: 201042
                    claims:
                      sub: "201042"
                      iss: ASO-qacurr
                      iat: 1764868918
                      exp: 1764869518
                      j1UserId: j1-000777
                      tenantId: "99999999009"
                      userType: buyer
                      userName: mnauman@jaggaer.com
                      userId: 201042
                      customerHostId: 275
                      email: mnauman@jaggaer.com
        "400":
          description: Invalid request (missing access token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Invalid Request:
                  description: Access token is required
                  value:
                    error: Access token is required
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateTokenResponse'
              examples:
                Expired:
                  description: Access token expired
                  value:
                    valid: false
                    error: Token has expired
                Invalid Signature:
                  description: Invalid access token signature
                  value:
                    valid: false
                    error: Invalid token signature
                Invalid Token:
                  description: Invalid access token
                  value:
                    valid: false
                    error: Invalid token
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Unexpected Error:
                  description: Unexpected error
                  value:
                    error: Failed to validate token
  /oauth2/token:
    post:
      tags:
      - OAuth 2.0 Authentication
      summary: Bearer Token Issuance
      description: Obtain a system-to-system bearer access token.
      operationId: token
      parameters:
      - name: Accept
        in: header
        description: Accept
        required: true
        schema:
          type: string
        example: application/json
      - name: Content-Type
        in: header
        description: Content-Type
        required: true
        schema:
          type: string
        example: application/x-www-form-urlencoded
      - name: X-API-KEY
        in: header
        description: Api key
        required: true
        schema:
          type: string
        example: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
      - name: grant_type
        in: query
        description: OAuth grant_type; Will always be 'grant_type=client_credentials'
        required: true
        schema:
          type: string
        example: grant_type=client_credentials
      - name: scope
        in: query
        description: "Token scope; Will be 'tenant-aso {customer-host-id}' or 'tenant-j1\
          \ {tenant-id}'"
        required: true
        schema:
          type: string
        examples:
          tenant-aso:
            description: Scope the token using customer host ID
            value: scope=tenant-aso 275
          tenant-j1:
            description: Scope the token using tenant ID
            value: scope=tenant-j1 99999999009
      - name: Authorization
        in: header
        description: Uses 'Basic' auth and takes the value of Base64ed 'client-id:client-secret'
        required: true
        schema:
          type: string
        example: Basic cWFfYWRtaW5fYXBpOjM3ODQzlMpOlillMDktMTFlYi1hMGJhLTAwNTA1NjgwZmVlYQ==
      responses:
        "200":
          description: System-to-system bearer access token successfully returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
              examples:
                SUCCESS:
                  description: Success response
                  value:
                    scope: "2"
                    access_token: 3ea64352-8a05-4bb1-a2ac-d4e40e5a0837
                    token_type: bearer
                    expires_in: 86400
        "400":
          description: Invalid request
        "401":
          description: Authorization or authentication issue
        "403":
          description: Authorization or authentication issue
components:
  schemas:
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        accessExpiresIn:
          type: integer
          format: int64
        refreshToken:
          type: string
        refreshExpiresIn:
          type: integer
          format: int64
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
    GenerateTokenRequest:
      type: object
      properties:
        tgt:
          type: string
    PublicKeyResponse:
      type: object
      properties:
        keyId:
          type: string
        issuer:
          type: string
        keyType:
          type: string
        algorithm:
          type: string
        keySize:
          type: integer
          format: int32
        format:
          type: string
        publicKey:
          type: string
    RefreshTokenRequest:
      type: object
      properties:
        refreshToken:
          type: string
    ValidateTokenResponse:
      type: object
      properties:
        valid:
          type: boolean
        userId:
          type: integer
          format: int64
        claims:
          type: object
          additionalProperties:
            type: object
        error:
          type: string
    ValidateTokenRequest:
      type: object
      properties:
        token:
          type: string
    AccessTokenResponse:
      type: object
      properties:
        scope:
          type: string
        access_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
          format: int64
        refresh_token:
          type: string
